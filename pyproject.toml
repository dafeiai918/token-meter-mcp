[project]
name = "token-meter-mcp"
version = "1.0.0"
description = "Token 用量与成本分析 MCP：算花费 / 排行 / 省钱建议"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
token-meter-mcp = "token_meter_mcp:main"

[project.urls]
Homepage = "https://github.com/dafeiai918/token-meter-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["token_meter_mcp.py"]
